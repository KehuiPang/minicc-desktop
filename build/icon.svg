<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E232B"/>
      <stop offset="1" stop-color="#14171C"/>
    </linearGradient>
  </defs>
  <!-- squircle 玄墨黑背景：中间 824×824，四周约 100px 透明（与其他 app 一致大小） -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  <!-- 月白圆环，右上留缺口（一念之门）。半径缩小，留足到边距 -->
  <path d="M728.7 473.8 A220 220 0 1 1 587.2 305.3" fill="none" stroke="#F4F6F8" stroke-width="44" stroke-linecap="round"/>
  <!-- 缺口处一点朱赭火种 -->
  <circle cx="680.5" cy="370.5" r="45" fill="#C05F3C"/>
</svg>
